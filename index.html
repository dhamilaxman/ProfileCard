<!DOCTYPE html>
<html>
<head>
    <title>Simple Profile Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Center using Flexbox */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

            background-color: #f2f2f2;
        }

        .card {
            background: white;
            width: 280px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        /* Hover effect */
        .card:hover {
            transform: scale(1.05);
        }

        /* Circular image */
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        h2 {
            margin: 10px 0 5px;
        }

        .designation {
            color: gray;
            font-size: 14px;
        }

        .bio {
            font-size: 14px;
            margin: 10px 0;
        }

        .social-icons a {
            margin: 0 10px;
            color: black;
            font-size: 18px;
            text-decoration: none;
        }

        .social-icons a:hover {
            color: blue;
        }

        /* Responsive for mobile */
        @media (max-width: 500px) {
            .card {
                width: 90%;
            }
        }

    </style>
</head>

<body>

    <div class="card">
        <img src="https://via.placeholder.com/150" class="profile-img">

        <h2>Laxman Singh </h2>
        <p class="designation">Web Developer</p>

        <p class="bio">
            I love building simple and clean websites.
            Always learning new technologies and improving my skills.
        </p>

        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
    </div>

</body>
</html>
